

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nandlal Gupta - Digital Business Card</title>
  
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <div class="card">
    
    <div class="card-header">
      <div class="avatar-container">
        <img src="nand.png" alt="Nandlal Gupta" class="avatar-img">
      </div>
      <h1 class="user-name">Nandlal Gupta</h1>
      <p class="user-job">Full Stack Developer</p>
      
      <div class="location-badge">
        <i class="fa-solid fa-location-dot"></i>
        <span>Siliguri, West Bengal, India</span>
      </div>
    </div>

    <div class="contact-section">
      <a href="mailto:nandlalgupta1809@gmail.com" class="contact-link">
        <div class="contact-left">
          <div class="icon-box">
            <i class="fa-regular fa-envelope"></i>
          </div>
          <span class="email-text">nandlalgupta1809@gmail.com</span>
        </div>
        <i class="fa-solid fa-chevron-right arrow-icon"></i>
      </a>
    </div>

    <div class="card-footer">
      <a href="https://github.com/nandlalgupta1809-dot" target="_blank" class="social-btn" title="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
      <a href="https://www.linkedin.com/in/nandlal-gupta-" target="_blank" class="social-btn" title="LinkedIn">
        <i class="fa-brands fa-linkedin-in"></i>
      </a>
    </div>

  </div>

</body>
</html>
